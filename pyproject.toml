[project]
name = "holy-spend"
version = "0.1.0"
description = "Self-hosted personal spending and receipt intelligence backend."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "httpcore>=1.0.0,<2",
    "mcp>=1.21.0,<2",
    "psycopg[binary,pool]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.20",
    "requests>=2.32.0",
    "storage3>=2.31.0,<3",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11.0",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["mcp.*", "psycopg.*", "psycopg_pool.*", "storage3.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
