name: Staging auth and MCP smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && github.repository == 'adi-sharma-96/holy-spend-dev'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    env:
      SMOKE_ADMIN_DATABASE_URL: ${{ secrets.SMOKE_ADMIN_DATABASE_URL }}
      SMOKE_OAUTH_CLIENT_SECRET: ${{ secrets.SMOKE_OAUTH_CLIENT_SECRET }}
      PAT_PEPPER: ${{ secrets.PAT_PEPPER }}
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
      SMOKE_OWNER_USER_ID: ${{ vars.SMOKE_OWNER_USER_ID }}
      SMOKE_OAUTH_CLIENT_ID: ${{ vars.SMOKE_OAUTH_CLIENT_ID }}
      SMOKE_OAUTH_REDIRECT_URI: ${{ vars.SMOKE_OAUTH_REDIRECT_URI }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke dependencies
        run: python -m pip install -e .
      - name: Check protected staging configuration
        run: |
          test -n "$SMOKE_ADMIN_DATABASE_URL"
          test -n "$SMOKE_OAUTH_CLIENT_SECRET"
          test -n "$PAT_PEPPER"
          test -n "$SMOKE_BASE_URL"
          test -n "$SMOKE_OWNER_USER_ID"
          test -n "$SMOKE_OAUTH_CLIENT_ID"
          test -n "$SMOKE_OAUTH_REDIRECT_URI"
      - name: Run bounded smoke
        run: |
          python -m scripts.auth_smoke \
            --base-url "$SMOKE_BASE_URL" \
            --user-id "$SMOKE_OWNER_USER_ID" \
            --oauth-client-id "$SMOKE_OAUTH_CLIENT_ID" \
            --oauth-redirect-uri "$SMOKE_OAUTH_REDIRECT_URI"
