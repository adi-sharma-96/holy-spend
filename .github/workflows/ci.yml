name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app tests

      - name: Pytest
        run: pytest

      - name: Widget dependencies
        working-directory: widget
        run: npm ci

      - name: Widget dependency audit
        working-directory: widget
        run: npm audit

      - name: Widget tests
        working-directory: widget
        run: npm test

      - name: Widget build
        working-directory: widget
        run: npm run build

  oauth-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-test-only
      PGDATABASE: postgres
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:local-test-only@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://expense_app:r1-local-test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply disposable schema and runtime grants
        run: |
          psql -v ON_ERROR_STOP=1 -f scripts/supabase_sqlcheck_bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -v expense_app_password=r1-local-test -f supabase/bootstrap/001_runtime_role.sql
          psql -v ON_ERROR_STOP=1 -v expense_app_password=r1-local-test -f supabase/bootstrap/001_runtime_role.sql
      - name: OAuth PostgreSQL integration
        run: pytest tests/test_oauth_code_storage_integration.py
      - name: Product review and owner isolation PostgreSQL integration
        run: pytest tests/test_product_review_integration.py tests/test_rls_integration.py
      - name: Local gateway and MCP authentication smoke
        run: bash scripts/ci_auth_smoke.sh
