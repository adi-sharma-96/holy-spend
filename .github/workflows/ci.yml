name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app tests

      - name: Pytest
        run: pytest

      - name: Widget dependencies
        working-directory: widget
        run: npm ci

      - name: Widget production audit
        working-directory: widget
        run: npm audit --omit=dev

      - name: Widget tests
        working-directory: widget
        run: npm test

      - name: Widget build
        working-directory: widget
        run: npm run build
